<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Betterfly 机器人管理</title>
<style>
:root { color-scheme: light dark; --bg: #f6f7f9; --card: #fff; --text: #1d2129; --muted: #6b7280; --line: #e5e7eb; --accent: #2563eb; --danger: #dc2626; }
@media (prefers-color-scheme: dark) { :root { --bg: #111318; --card: #1b1e25; --text: #e5e7eb; --muted: #9ca3af; --line: #2d313a; --accent: #60a5fa; --danger: #f87171; } }
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 20px; margin: 0 0 16px; }
h2 { font-size: 16px; margin: 0 0 12px; }
section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 4px; }
input, textarea { width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit; font: inherit; }
textarea { min-height: 56px; resize: vertical; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
button { padding: 7px 14px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
button.secondary { background: transparent; color: var(--accent); }
button.danger { background: transparent; color: var(--danger); border-color: var(--danger); }
.bot { border-top: 1px solid var(--line); padding: 12px 0; }
.bot:first-child { border-top: 0; }
.meta { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.badge { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); margin-left: 6px; }
.notice { padding: 10px 12px; border-radius: 6px; border: 1px solid var(--accent); margin-bottom: 16px; overflow-wrap: anywhere; display: none; }
.notice.error { border-color: var(--danger); color: var(--danger); }
code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
.check { display: flex; gap: 6px; align-items: center; color: var(--text); font-size: 14px; }
.check input { width: auto; }
</style>
</head>
<body>
<main>
<h1>Betterfly 机器人管理</h1>
<div id="notice" class="notice"></div>

<section>
  <h2>管理令牌</h2>
  <div class="row">
    <input id="admin-token" type="password" autocomplete="off" placeholder="CHATBOT_ADMIN_TOKEN" style="flex:1;min-width:200px">
    <button id="connect">连接</button>
  </div>
  <p class="meta">令牌只保存在当前标签页的会话存储里。</p>
</section>

<section>
  <h2>创建机器人</h2>
  <form id="create-form">
    <div class="grid">
      <div><label for="account">账号（小写字母、数字、下划线）</label><input id="account" required pattern="[a-z0-9_]{3,50}"></div>
      <div><label for="name">名字</label><input id="name" required maxlength="50"></div>
      <div><label for="avatar">头像 file_id（可选）</label><input id="avatar"></div>
    </div>
    <div style="margin-top:12px"><label for="description">简介</label><textarea id="description" maxlength="512"></textarea></div>
    <div class="row" style="margin-top:12px">
      <label class="check"><input id="allow-groups" type="checkbox" checked> 允许加入群聊</label>
      <span style="flex:1"></span>
      <button type="submit">创建并生成令牌</button>
    </div>
  </form>
</section>

<section>
  <div class="row" style="justify-content:space-between;margin-bottom:8px"><h2 style="margin:0">机器人</h2><button class="secondary" id="refresh">刷新</button></div>
  <div id="bots"><p class="meta">输入管理令牌后显示。</p></div>
</section>
</main>
<script>
const tokenInput = document.getElementById("admin-token");
const notice = document.getElementById("notice");
try { tokenInput.value = sessionStorage.getItem("betterfly-admin-token") || ""; } catch (_) {}

function show(message, isError) {
  notice.textContent = message;
  notice.className = "notice" + (isError ? " error" : "");
  notice.style.display = "block";
}

async function api(method, path, body) {
  const response = await fetch(path, {
    method,
    headers: { "X-Admin-Token": tokenInput.value, "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const data = await response.json().catch(() => ({ ok: false, error: { message: "HTTP " + response.status } }));
  if (!data.ok) throw new Error(data.error && data.error.message || "请求失败");
  return data.result;
}

function element(tag, attributes, children) {
  const node = document.createElement(tag);
  Object.entries(attributes || {}).forEach(([key, value]) => {
    if (key === "onclick") node.addEventListener("click", value); else node.setAttribute(key, value);
  });
  (children || []).forEach((child) => node.append(child));
  return node;
}

function showToken(bot, token) {
  show("机器人 " + bot + " 的令牌（只显示这一次，请立即保存）：" + token, false);
}

function renderBot(bot) {
  const badges = [element("span", { class: "badge" }, [bot.delivery === "kafka" ? "内置" : "Bot API"])];
  if (bot.disabled) badges.push(element("span", { class: "badge" }, ["已停用"]));
  if (!bot.allow_groups) badges.push(element("span", { class: "badge" }, ["不进群"]));
  const lines = ["ID " + bot.id + " · @" + bot.account];
  if (bot.kafka_topic) lines.push("Kafka topic: " + bot.kafka_topic);
  if (bot.webhook_url) lines.push("Webhook: " + bot.webhook_url + (bot.webhook_failures ? "（连续失败 " + bot.webhook_failures + " 次：" + (bot.webhook_last_error || "") + "）" : ""));
  else if (bot.delivery === "api") lines.push("使用长轮询 GET /bot/v1/updates");
  if (bot.description) lines.push(bot.description);

  const actions = [
    element("button", { class: "secondary", onclick: async () => {
      const name = prompt("新名字", bot.name);
      if (name === null) return;
      await run(() => api("PATCH", "/admin/api/bots/" + bot.id, { name }), "已更新名字");
    } }, ["改名"]),
    element("button", { class: "secondary", onclick: () => run(() => api("PATCH", "/admin/api/bots/" + bot.id, { allow_groups: !bot.allow_groups }), "已更新群聊设置") },
      [bot.allow_groups ? "禁止进群" : "允许进群"]),
    element("button", { class: bot.disabled ? "secondary" : "danger", onclick: () => run(() => api("PATCH", "/admin/api/bots/" + bot.id, { disabled: !bot.disabled }), bot.disabled ? "已启用" : "已停用") },
      [bot.disabled ? "启用" : "停用"]),
  ];
  if (bot.delivery === "api") {
    actions.push(element("button", { class: "danger", onclick: async () => {
      if (!confirm("重置后旧令牌立即失效，确定吗？")) return;
      try { const result = await api("POST", "/admin/api/bots/" + bot.id + "/token"); showToken(bot.account, result.token); } catch (error) { show(error.message, true); }
    } }, ["重置令牌"]));
  }
  return element("div", { class: "bot" }, [
    element("div", {}, [element("strong", {}, [bot.name])].concat(badges)),
    element("div", { class: "meta" }, [lines.join(" · ")]),
    element("div", { class: "row", style: "margin-top:8px" }, actions),
  ]);
}

async function load() {
  try { sessionStorage.setItem("betterfly-admin-token", tokenInput.value); } catch (_) {}
  const container = document.getElementById("bots");
  try {
    const bots = await api("GET", "/admin/api/bots");
    container.replaceChildren(...(bots.length ? bots.map(renderBot) : [element("p", { class: "meta" }, ["还没有机器人。"])]));
  } catch (error) {
    show(error.message, true);
  }
}

async function run(action, message) {
  try { await action(); show(message, false); await load(); } catch (error) { show(error.message, true); }
}

document.getElementById("connect").addEventListener("click", load);
document.getElementById("refresh").addEventListener("click", load);
document.getElementById("create-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  try {
    const result = await api("POST", "/admin/api/bots", {
      account: document.getElementById("account").value.trim(),
      name: document.getElementById("name").value,
      avatar: document.getElementById("avatar").value.trim(),
      description: document.getElementById("description").value,
      allow_groups: document.getElementById("allow-groups").checked,
    });
    event.target.reset();
    showToken(result.bot.account, result.token);
    await load();
  } catch (error) {
    show(error.message, true);
  }
});
if (tokenInput.value) load();
</script>
</body>
</html>
