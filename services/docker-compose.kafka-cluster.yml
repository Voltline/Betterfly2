# Explicit cluster-testing topology; never reuse single-node Kafka metadata.
# Requires Compose >= 2.24.4 for !override.
services:
  kafka1:
    labels:
      betterfly.kafka.topology: cluster
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9095
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
    volumes: !override
      - kafka-cluster-1-data:/var/lib/kafka/data

  kafka2:
    image: apache/kafka:4.2.0
    container_name: kafka2
    labels:
      betterfly.kafka.topology: cluster
    mem_limit: 1g
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx512m"
      KAFKA_LOG_DIRS: /var/lib/kafka/data/betterfly
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka2:9094,CONTROLLER://kafka2:9095
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9095
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "9094:9094"
    volumes:
      - kafka-cluster-2-data:/var/lib/kafka/data
    networks:
      - backend

  kafka-init:
    depends_on:
      - kafka1
      - kafka2
    environment:
      KAFKA_BROKER: kafka1:9092,kafka2:9094
      DLQ_REPLICATION_FACTOR: ${DF_KAFKA_DLQ_REPLICATION_FACTOR:-2}
      DLQ_MIN_ISR: ${DF_KAFKA_DLQ_MIN_ISR:-1}

  kafka-ui:
    environment:
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:9092,kafka2:9094
    depends_on:
      - kafka1
      - kafka2

  df:
    environment:
      KAFKA_BROKER: kafka1:9092,kafka2:9094
  df2:
    environment:
      KAFKA_BROKER: kafka1:9092,kafka2:9094
  storage_service:
    environment:
      KAFKA_BROKER: kafka1:9092,kafka2:9094
  friend_service:
    environment:
      KAFKA_BROKER: kafka1:9092,kafka2:9094
  call_service:
    environment:
      KAFKA_BROKER: kafka1:9092,kafka2:9094
  push_service:
    environment:
      KAFKA_BROKER: kafka1:9092,kafka2:9094

volumes:
  kafka-cluster-1-data:
  kafka-cluster-2-data:
