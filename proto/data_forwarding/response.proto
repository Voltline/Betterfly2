syntax = "proto3";
package df_interface;
option go_package = "Betterfly2/proto/data_forwarding";

enum LoginResult {
  LOGIN_OK = 0;
  ACCOUNT_NOT_EXIST = 1;
  PASSWORD_ERROR = 2;
  JWT_ERROR = 3;
  LOGIN_SVR_ERROR = 10;
}

enum SignupResult {
  SIGNUP_OK = 0;
  ACCOUNT_EXIST = 1;
  ACCOUNT_EMPTY = 2;
  PASSWORD_EMPTY = 3;
  ACCOUNT_TOO_LONG = 4;
  PASSWORD_TOO_SHORT = 5; // 少于 8 字节
  PASSWORD_TOO_LONG = 6;  // 超过 72 字节（bcrypt 上限）
  SIGNUP_SVR_ERROR = 10;
}

message LoginRsp {
  LoginResult result = 1;
  int64 user_id = 2;
  string jwt = 3;
}

message SignupRsp {
  SignupResult result = 1;
}

message Refused { // 就是空的
}

message Server {
  string server_msg = 1;
}

message Warn {
  string warning_message = 1;
}

// PostAckResult 表示一条Post的处理结果。旧服务端不填result，默认POST_ACK_OK，语义不变。
enum PostAckResult {
  POST_ACK_OK = 0;
  POST_ACK_INVALID_ARGUMENT = 1; // 长度、NUL、配文或文件content格式等不合法，永久失败，不要自动重发
  POST_ACK_FORBIDDEN = 2;        // 无群或频道发帖权限、未持有引用的文件等，永久失败，不要自动重发
  POST_ACK_RATE_LIMITED = 3;     // 发送过于频繁，按retry_after_ms退避后可重发
  POST_ACK_SERVICE_ERROR = 10;   // 暂时故障，可按现有策略重发
}

// PostAckRsp 是Post的回执。成功时message_id>0；被拒时message_id=0且result非OK。
// 同一次拒绝，服务端先发本回执，再发兼容旧客户端的Warn，二者顺序固定。
message PostAckRsp {
  int64 message_id = 1;
  string client_message_id = 2; // 与Post.client_message_id对应，客户端据此匹配乱序ACK
  string timestamp = 3; // 服务端入库时间
  PostAckResult result = 4;
  string reason = 5; // 被拒时给用户看的简短原因
  int32 retry_after_ms = 6; // 仅POST_ACK_RATE_LIMITED时有值
}

message UserInfo {
  int64 send_to_user_id = 1;
  string query_user_name = 2;
  int64 user_id = 3;
  string account = 4;
  string name = 5;
  string avatar = 6;
  string update_time = 7;
}

message ContactInfo {
  int64 user_id = 1;
  string account = 2;
  string name = 3;
  string avatar = 4;
  string alias = 5;
  bool is_notify = 6;
  string update_time = 7;
}

message ContactListRsp {
  repeated ContactInfo contacts = 1;
  string etag = 2;        // 不透明字符串，空表示不可缓存；不跨服务端版本保证
  bool not_modified = 3;  // 为true时contacts为空，保留本地数据
}

message GroupInfo {
  bool client_need_save = 1; // 对于原先的msg字段, 0保存，1不保存
  int64 query_group_id = 2;
  string query_group_name = 3;
  string avatar = 4;
  bool is_channel = 5;
  int32 member_count = 6;
}

message GroupMemberInfo {
  int64 user_id = 1;
  string account = 2;
  string name = 3;
  string avatar = 4;
  string role = 5;
  string update_time = 6;
}

message GroupMembersRsp {
  int64 group_id = 1;
  repeated GroupMemberInfo members = 2; // 按user_id升序
  string next_cursor = 3;               // 不透明游标，原样回传以获取下一页
  bool has_more = 4;
  int32 total_count = 5;                // 仅第一页填写
  string result = 6;                    // 空表示成功；游标无效或limit为负时为INVALID_ARGUMENT
  string cursor = 7;                    // 原样带回请求的cursor，用于丢弃过期页
  string etag = 8;                      // 仅一页即全部成员时填写
  bool not_modified = 9;                // 为true时members为空，保留本地数据
}

message JoinedGroupInfo {
  int64 group_id = 1;
  string group_name = 2;
  string avatar = 3;
  int64 owner_user_id = 4;
  string update_time = 5;
  bool is_channel = 6;
  bool notifications_muted = 7;
  int32 member_count = 8;
}

message JoinedGroupsRsp {
  repeated JoinedGroupInfo groups = 1;
  string etag = 2;
  bool not_modified = 3;
}

message RelationshipRequestInfo {
  int64 request_id = 1;
  string request_type = 2; // friend/group_join/group_invite
  int64 requester_user_id = 3;
  string requester_name = 4;
  string requester_avatar = 5;
  int64 target_user_id = 6;
  string target_name = 7;
  string target_avatar = 8;
  int64 group_id = 9;
  string group_name = 10;
  string group_avatar = 11;
  string message = 12;
  string status = 13;
  string created_at = 14;
  string expires_at = 15;
  string resolved_at = 16;
  int64 resolved_by = 17;
}

message RelationshipRequestListRsp {
  repeated RelationshipRequestInfo requests = 1;
}

message RelationshipOperationRsp {
  string operation = 1;
  string result = 2;
  RelationshipRequestInfo request = 3;
}

// 服务端主动推送，不对应任何请求；request为变化后的完整状态，按request_id覆盖本地记录。
message RelationshipChangedEvent {
  RelationshipRequestInfo request = 1;
  string operation = 2; // created/resolved/cancelled
  string changed_at = 3;
}

message GroupMemberOperationRsp {
  string operation = 1;
  string result = 2;
  int64 group_id = 3;
  int64 user_id = 4;
  string role = 5;
  string update_time = 6;
  string group_name = 7;
  int64 previous_owner_user_id = 8;
  bool notifications_muted = 9; // Meaningful for update_group_notify.
}

enum AccountSecurityResult {
  ACCOUNT_SECURITY_OK = 0;
  ACCOUNT_SECURITY_OLD_PASSWORD_ERROR = 1;
  ACCOUNT_SECURITY_JWT_ERROR = 2;
  ACCOUNT_SECURITY_PASSWORD_TOO_SHORT = 3;
  ACCOUNT_SECURITY_PASSWORD_TOO_LONG = 4;
  ACCOUNT_SECURITY_SERVICE_ERROR = 10;
}

message AccountSecurityRsp {
  string operation = 1;
  AccountSecurityResult result = 2;
  string jwt = 3;
}

// 单条消息响应
message MessageRsp {
  int64 from_user_id = 1;
  int64 to_user_id = 2;
  string content = 3;
  string timestamp = 4;
  string msg_type = 5;
  bool is_group = 6;
  string real_file_name = 7;
  int64 message_id = 8;
  bool is_recalled = 9;
  string recalled_at = 10;
  int64 recalled_by = 11;
  string caption = 12;
  int64 reply_to_message_id = 13;
  int64 discussion_root_message_id = 14;
  int64 source_channel_message_id = 15;
}

// 同步消息响应
message SyncMessagesRsp {
  repeated MessageRsp msgs = 1;
  bool has_more = 2;
  string next_cursor_timestamp = 3;
  int64 next_cursor_message_id = 4;
  repeated MessageRsp recalled_msgs = 5;
  bool recalls_has_more = 6;
  string next_recall_cursor_timestamp = 7;
  int64 next_recall_cursor_message_id = 8;
}
